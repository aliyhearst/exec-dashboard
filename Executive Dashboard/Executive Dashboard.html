<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekly Executive Project <span className="accent">Update</span></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAFAFA;
  --bg-2: #F5F5F5;
  --panel: #FFFFFF;
  --ink: #0A0A0A;
  --ink-2: #262626;
  --ink-3: #525252;
  --muted: #737373;
  --muted-2: #A3A3A3;
  --line: #EDEDED;
  --line-2: #F4F4F4;
  --line-3: #E5E5E5;
  --accent: #0A0A0A;
  --accent-ink: #0A0A0A;
  --green: #16A34A;
  --green-soft: #F0FDF4;
  --green-ink: #15803D;
  --amber: #D97706;
  --amber-soft: #FFFBEB;
  --amber-ink: #B45309;
  --red: #DC2626;
  --red-soft: #FEF2F2;
  --red-ink: #B91C1C;
  --shadow-sm: 0 1px 2px rgba(10,10,10,0.04);
  --shadow-md: 0 1px 2px rgba(10,10,10,0.04), 0 1px 1px rgba(10,10,10,0.02);
  --shadow-lg: 0 24px 56px rgba(10,10,10,0.12), 0 4px 12px rgba(10,10,10,0.04);
  --radius: 12px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-feature-settings: 'ss01','cv11';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 14.5px;
  line-height: 1.5;
  letter-spacing: -0.005em;
}
.mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-feature-settings: 'ss01'; letter-spacing: -0.01em; }
.serif { font-family: 'Instrument Serif', 'Iowan Old Style', Georgia, serif; letter-spacing: 0; }

button { font-family: inherit; cursor: pointer; }

/* ---------- Shell ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(250,250,250,0.82);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner { max-width: 1440px; margin: 0 auto; padding: 14px 48px;
  display: flex; align-items: center; gap: 16px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 500; letter-spacing: -0.015em;
}
.brand-mark {
  width: 20px; height: 20px; border-radius: 6px;
  background: #0A0A0A;
  display: inline-block; position: relative;
}
.brand-mark::after {
  content: ''; position: absolute; inset: auto auto 4px 4px; width: 5px; height: 5px;
  background: #FAFAFA; border-radius: 50%;
}
.brand-name { font-size: 14px; color: var(--ink); }
.brand-sep { color: var(--muted-2); font-weight: 300; }
.brand-sub { font-size: 14px; color: var(--muted); font-weight: 400; }
.top-spacer { flex: 1; }
.top-meta { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.top-meta .mono { color: var(--ink-2); font-size: 12.5px; }
.top-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted-2); }

/* ---------- Page ---------- */
.page { max-width: 1440px; margin: 0 auto; padding: 56px 48px 96px; width: 100%; }

.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 32px;
  margin-bottom: 44px;
}
.eyebrow {
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 16px;
  font-weight: 400;
}
h1.title {
  font-family: 'Geist', sans-serif;
  font-size: 40px;
  letter-spacing: -0.032em;
  font-weight: 500;
  margin: 0;
  line-height: 1.05;
  color: var(--ink);
}
h1.title .accent {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.01em;
}
.subtitle {
  color: var(--muted); font-size: 15px; margin-top: 12px;
  letter-spacing: -0.005em;
}

.head-actions {
  display: flex; gap: 6px; align-items: center;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--line-3);
  background: var(--panel);
  color: var(--ink-2);
  font-size: 13.5px; font-weight: 500;
  transition: all .12s ease;
  letter-spacing: -0.005em;
  height: 34px;
}
.btn:hover { border-color: #D4D4D4; background: #FAFAFA; color: var(--ink); }
.btn.primary {
  background: var(--ink); color: #FAFAFA; border-color: var(--ink);
}
.btn.primary:hover { background: #262626; border-color: #262626; color: #FFF; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: rgba(10,10,10,0.04); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 7px; height: 28px; }
.btn-icon { width: 13px; height: 13px; display: inline-block; flex: 0 0 auto; }

.segmented {
  display: inline-flex; background: var(--panel); border: 1px solid var(--line-3);
  border-radius: 8px; padding: 3px; height: 34px;
}
.segmented button {
  border: 0; background: transparent; padding: 0 11px; font-size: 13px;
  color: var(--muted); border-radius: 5px; font-weight: 500;
  letter-spacing: -0.005em;
  transition: all .12s;
  height: 26px;
}
.segmented button.on { background: var(--ink); color: #FAFAFA; }
.segmented button:not(.on):hover { color: var(--ink); }

.select {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 0 10px; font-size: 13px; color: var(--ink-2);
  border: 1px solid var(--line-3); background: var(--panel); border-radius: 8px;
  height: 34px;
}
.select select {
  border: 0; background: transparent; color: var(--ink-2);
  font-family: inherit; font-size: 13px; outline: none;
  appearance: none; padding-right: 14px; cursor: pointer;
  letter-spacing: -0.005em;
}
.select-caret { color: var(--muted-2); font-size: 10px; }

/* ---------- Exec summary ---------- */
.summary { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); padding: 28px 32px; display: grid; grid-template-columns: 260px 1fr; gap: 40px; margin-bottom: 40px; position: relative; max-width: 1200px; }
.summary-head { display: flex; align-items: center; gap: 10px; }
.summary-badge {
  font-family: 'Geist Mono', monospace;
  font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.summary-badge .dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); margin-right: 7px; vertical-align: middle;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.summary-title {
  font-size: 18px; font-weight: 500; letter-spacing: -0.02em;
  margin-top: 14px; color: var(--ink);
}
.summary-meta {
  font-size: 13px; color: var(--muted); margin-top: 4px;
}
.health-ring {
  margin-top: 28px;
  display: flex; align-items: center; gap: 20px;
}
.donut { width: 88px; height: 88px; }
.donut circle { fill: none; stroke-width: 8; }
.donut .track { stroke: var(--line-2); }
.health-legend {
  display: flex; flex-direction: column; gap: 8px; font-size: 13px;
}
.health-legend .row { display: flex; align-items: center; gap: 9px; }
.health-legend .dot { width: 7px; height: 7px; border-radius: 50%; }
.health-legend .count {
  font-variant-numeric: tabular-nums; color: var(--ink);
  font-weight: 500; width: 14px; text-align: right;
  font-family: 'Geist Mono', monospace; font-size: 12.5px;
}
.health-legend .label { color: var(--muted); }

.summary-bullets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px 32px;
  align-content: start;
  padding-left: 40px;
  border-left: 1px solid var(--line);
}
.sum-item {
  display: flex; gap: 12px; align-items: flex-start;
  font-size: 14px; color: var(--ink-2);
  line-height: 1.55;
  letter-spacing: -0.005em;
}
.sum-item .marker {
  flex: 0 0 auto; margin-top: 7px;
  width: 6px; height: 6px; border-radius: 50%;
}
.sum-item.positive .marker { background: var(--green); }
.sum-item.negative .marker { background: var(--red); }
.sum-item.neutral .marker { background: var(--muted-2); }

/* ---------- Toolbar ---------- */
.toolbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; gap: 16px; flex-wrap: wrap;
}
.toolbar-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar-right { display: flex; gap: 10px; align-items: center; }
.toolbar-label { font-size: 13px; color: var(--muted); letter-spacing: -0.005em; }

/* ---------- Grid ---------- */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.grid.compact { grid-template-columns: repeat(4, 1fr); }

/* ---------- Project card ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px 26px 22px;
  display: flex; flex-direction: column;
  gap: 20px;
  transition: border-color .15s ease, transform .15s ease;
  position: relative;
}
.card:hover { border-color: var(--line-3); }

.card.compact {
  padding: 18px 20px 16px;
  gap: 14px;
  border-radius: 12px;
}
.card.compact .proj-title { font-size: 15px; }
.card.compact .proj-sections { grid-template-columns: 1fr; gap: 12px; }

.card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px;
}
.proj-title {
  font-size: 18px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  line-height: 1.25;
}
.change-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Geist Mono', monospace; font-size: 11px;
  padding: 3px 7px; border-radius: 5px; font-weight: 500;
  letter-spacing: 0;
  border: 1px solid transparent;
  text-transform: none;
}
.change-badge.worse {
  background: var(--red-soft); color: var(--red-ink); border-color: #FECACA;
}
.change-badge.better {
  background: var(--green-soft); color: var(--green-ink); border-color: #BBF7D0;
}
.change-badge svg { width: 9px; height: 9px; }

.meta-row {
  margin-top: 6px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--muted);
  letter-spacing: -0.005em;
}
.meta-row .dot-sep { color: var(--muted-2); font-weight: 300; }
.meta-row .owner { color: var(--ink-2); font-weight: 500; }
.meta-row .team { color: var(--muted); }
.meta-row .mono { font-size: 12.5px; }

.status {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 500;
  padding: 4px 10px 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--line-3);
  background: var(--panel);
  color: var(--ink-2);
  white-space: nowrap;
  letter-spacing: -0.005em;
}
.status .pulse {
  width: 7px; height: 7px; border-radius: 50%;
  position: relative;
}
.status.green .pulse { background: var(--green); box-shadow: 0 0 0 2.5px rgba(22,163,74,0.15); }
.status.yellow .pulse { background: var(--amber); box-shadow: 0 0 0 2.5px rgba(217,119,6,0.18); }
.status.red .pulse { background: var(--red); box-shadow: 0 0 0 2.5px rgba(220,38,38,0.18); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 2.5px rgba(220,38,38,0.18); }
  50% { box-shadow: 0 0 0 5px rgba(220,38,38,0.08); }
}

.proj-sections {
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px;
}
.section-block h4 {
  font-family: 'Geist Mono', monospace;
  font-size: 11px; color: var(--muted);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin: 0 0 10px 0;
  font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.section-block h4 .count {
  color: var(--muted-2); font-weight: 400;
}
.section-block.risks { grid-column: 1 / -1; }

.bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.bullets li {
  font-size: 14px; color: var(--ink-2);
  display: flex; gap: 10px; align-items: flex-start;
  line-height: 1.5;
  letter-spacing: -0.005em;
}
.bullets li::before {
  content: ''; flex: 0 0 auto; width: 4px; height: 4px; border-radius: 50%;
  background: var(--muted-2); margin-top: 9px;
}
.bullets.next li::before { background: var(--ink); }
.bullets.risks li {
  background: var(--amber-soft);
  border: 1px solid #FDE68A;
  padding: 8px 12px 8px 30px;
  border-radius: 8px;
  color: var(--amber-ink);
  position: relative;
  font-size: 13.5px;
  line-height: 1.5;
}
.bullets.risks li::before { display: none; }
.bullets.risks li .warn {
  position: absolute; left: 10px; top: 10px;
  width: 13px; height: 13px; color: var(--amber);
}
.card.status-red .bullets.risks li {
  background: var(--red-soft); border-color: #FECACA; color: var(--red-ink);
}
.card.status-red .bullets.risks li .warn { color: var(--red); }

/* ---------- Metrics panel ---------- */
.metrics-toggle {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 2px;
  padding-top: 16px;
  border-top: 1px solid var(--line-2);
}
.metrics-toggle .btn { color: var(--muted); }
.metrics-toggle .btn:hover { color: var(--ink); }
.updated-tag { font-size: 12px; color: var(--muted-2); font-family: 'Geist Mono', monospace; letter-spacing: 0; }

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  overflow: hidden;
  max-height: 0;
  transition: max-height .32s ease, margin-top .2s, padding-top .2s;
  border-radius: 10px;
  background: var(--bg);
  border: 1px solid transparent;
}
.metrics.open {
  max-height: 260px;
  margin-top: 4px;
  padding: 2px;
  border-color: var(--line-2);
}
.metric {
  padding: 16px 18px 14px;
  border-right: 1px solid var(--line-2);
}
.metric:last-child { border-right: 0; }
.metric-label {
  font-family: 'Geist Mono', monospace;
  font-size: 11px; color: var(--muted);
  letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px;
  font-weight: 500;
}
.metric-value {
  font-size: 24px; letter-spacing: -0.03em; font-weight: 500; color: var(--ink);
  display: flex; align-items: baseline; gap: 10px;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.metric-delta {
  font-family: 'Geist Mono', monospace;
  font-size: 11.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 3px;
  letter-spacing: 0;
}
.metric-delta.up { color: var(--green-ink); }
.metric-delta.down { color: var(--red-ink); }
.metric-delta.flat { color: var(--muted); }
.metric-delta svg { width: 9px; height: 9px; }

/* ---------- More projects ---------- */
.more-wrap {
  margin-top: 48px;
}
.more-head {
  display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
}
.more-head h2 {
  font-size: 16px; font-weight: 500; letter-spacing: -0.015em; margin: 0; color: var(--ink);
}
.more-head .mono { font-size: 12px; color: var(--muted); letter-spacing: 0; }
.more-head .rule { flex: 1; height: 1px; background: var(--line); }

.empty {
  text-align: center; padding: 48px; color: var(--muted);
  border: 1px dashed var(--line-3); border-radius: 12px;
  background: var(--panel);
  font-size: 14px;
}

.view-all-wrap {
  margin-top: 32px; text-align: center;
}

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(10,10,10,0.32);
  backdrop-filter: blur(6px);
  z-index: 50;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 80px 24px 24px;
  overflow-y: auto;
  animation: fade .15s ease;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--panel);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 620px;
  padding: 32px;
  animation: rise .2s cubic-bezier(0.22, 1, 0.36, 1);
  border: 1px solid var(--line);
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.modal h3 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.022em; font-weight: 500; }
.modal p.muted { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-height: 1.5; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label {
  font-size: 12px; color: var(--muted);
  font-family: 'Geist Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em;
  font-weight: 500;
}
.form-field input, .form-field textarea, .form-field select {
  font-family: inherit; font-size: 14px;
  padding: 10px 12px;
  border: 1px solid var(--line-3); border-radius: 8px;
  background: var(--panel); color: var(--ink);
  resize: vertical;
  outline: none;
  transition: border-color .12s, box-shadow .12s;
  letter-spacing: -0.005em;
}
.form-field input:focus, .form-field textarea:focus, .form-field select:focus {
  border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10,10,10,0.06);
}
.form-field textarea { min-height: 72px; }

.status-picker { display: flex; gap: 8px; }
.status-picker label {
  flex: 1; cursor: pointer; user-select: none;
  padding: 10px 12px; border: 1px solid var(--line-3); border-radius: 8px;
  background: var(--panel); color: var(--ink-2); font-size: 13.5px;
  display: flex; align-items: center; gap: 8px;
  text-transform: none; letter-spacing: -0.005em; font-family: inherit;
  font-weight: 500;
  transition: all .12s;
}
.status-picker input { display: none; }
.status-picker label.sel-green { border-color: var(--green); background: var(--green-soft); color: var(--green-ink); }
.status-picker label.sel-yellow { border-color: var(--amber); background: var(--amber-soft); color: var(--amber-ink); }
.status-picker label.sel-red { border-color: var(--red); background: var(--red-soft); color: var(--red-ink); }
.swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transition: transform .15s; }

.form-actions {
  margin-top: 24px; display: flex; justify-content: flex-end; gap: 8px;
}

/* ---------- Tweaks ---------- */
.tweaks {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 40;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  padding: 16px 18px;
  width: 260px;
  font-size: 13.5px;
}
.tweaks h5 {
  margin: 0 0 10px 0;
  font-family: 'Geist Mono', monospace;
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  font-weight: 500;
}
.tweak-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0;
}
.tweak-row span { color: var(--ink-2); letter-spacing: -0.005em; }
.toggle {
  width: 30px; height: 18px; background: var(--line-3);
  border-radius: 20px; position: relative; cursor: pointer;
  border: none;
  transition: background .2s;
}
.toggle.on { background: var(--ink); }
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; background: white; border-radius: 50%;
  transition: left .2s;
}
.toggle.on::after { left: 14px; }

/* ---------- History banner ---------- */
.history-banner {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  background: #FEFBF0;
  border: 1px solid #FDE68A;
  border-radius: 10px;
  font-size: 13.5px; color: #92400E;
  margin-bottom: 20px;
}
.history-banner .mono { color: #78350F; font-weight: 500; font-size: 12.5px; }
.history-banner button { margin-left: auto; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #FAFAFA;
  padding: 11px 18px; border-radius: 10px; font-size: 13.5px;
  box-shadow: var(--shadow-lg);
  z-index: 60;
  animation: toastIn .2s ease;
  letter-spacing: -0.005em;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

function ChangeBadge({ prev, current }) {
  if (!prev || prev === current) return null;
  const order = { green: 0, yellow: 1, red: 2 };
  const worse = order[current] > order[prev];
  return (
    <span className={`change-badge ${worse ? 'worse' : 'better'}`}>
      {worse ? <Icon.Down /> : <Icon.Up />}
      {statusLabel(prev)}
      <Icon.ArrowRight />
      {statusLabel(current)}
    </span>
  );
}

function DeltaChip({ delta, unit = '', good = 'up' }) {
  if (delta == null) return null;
  const sign = delta > 0 ? '+' : delta < 0 ? '−' : '';
  const abs = Math.abs(delta);
  const isFlat = delta === 0;
  // "good" tells us which direction of change is positive. 'up' = higher is better.
  let tone = 'flat';
  if (!isFlat) {
    const positive = (delta > 0 && good === 'up') || (delta < 0 && good === 'down');
    tone = positive ? 'up' : 'down';
  }
  const arrow = isFlat ? <Icon.Flat /> : delta > 0 ? <Icon.Up /> : <Icon.Down />;
  return (
    <span className={`metric-delta ${tone}`}>
      {arrow}
      <span>{sign}{abs}{unit}</span>
    </span>
  );
}

function Metric({ m }) {
  return (
    <div className="metric">
      <div className="metric-label">{m.label}</div>
      <div className="metric-value">
        <span>{m.value}</span>
        <DeltaChip delta={m.delta} unit={m.unit || ''} good={m.good || 'up'} />
      </div>
    </div>
  );
}

function HealthDonut({ counts }) {
  const total = counts.green + counts.yellow + counts.red;
  const R = 38;
  const C = 2 * Math.PI * R;
  const segs = [
    { c: 'var(--green)', v: counts.green },
    { c: 'var(--amber)', v: counts.yellow },
    { c: 'var(--red)', v: counts.red },
  ];
  let offset = 0;
  return (
    <svg className="donut" viewBox="0 0 92 92">
      <circle className="track" cx="46" cy="46" r={R} />
      {segs.map((s, i) => {
        const len = (s.v / total) * C;
        const el = (
          <circle
            key={i}
            cx="46" cy="46" r={R}
            stroke={s.c}
            strokeDasharray={`${len} ${C}`}
            strokeDashoffset={-offset}
            strokeLinecap="butt"
            transform="rotate(-90 46 46)"
          />
        );
        offset += len;
        return el;
      })}
      <text x="46" y="44" textAnchor="middle" fontSize="18" fontWeight="600" fill="var(--ink)" fontFamily="Inter" letterSpacing="-0.02em">{total}</text>
      <text x="46" y="58" textAnchor="middle" fontSize="9" fill="var(--muted)" fontFamily="JetBrains Mono" letterSpacing="0.1em">PROJECTS</text>
    </svg>
  );
}

            <h3>Submit weekly update</h3>
            {lockedProject ? (
              <p className="muted" style={{marginBottom:0, display:'flex', alignItems:'center', gap:8}}>
                <Icon.Lock style={{width:13,height:13,color:'var(--muted)'}} />
                <span>Submitting an update for <strong style={{color:'var(--ink)'}}>{lockedProject.name}</strong> · <span className="mono" style={{fontSize:12}}>{lockedProject.owner}</span></span>
              </p>
            ) : (
              <p className="muted" style={{marginBottom:0}}>Paste a free-text update and let AI structure it, or fill fields manually.</p>
            )}
          </div>
          <button type="button" className="btn ghost sm" onClick={onClose} aria-label="Close"><Icon.X /></button>
        </div>

        <div className="mode-tabs">
          <button type="button" className={'mode-tab ' + (mode === 'paste' ? 'on' : '')} onClick={() => setMode('paste')}>
            <Icon.Sparkle /> Paste an update
          </button>
          <button type="button" className={'mode-tab ' + (mode === 'manual' ? 'on' : '')} onClick={() => setMode('manual')}>
            <Icon.Edit /> Manual entry
          </button>
          {parsed && (
            <span className="parse-badge" style={{marginLeft:'auto'}}>
              <span className="dot" style={{background:confidenceColor(parsed.confidence)}}></span>
              {confidenceLabel(parsed.confidence)} · {Math.round(parsed.confidence * 100)}%
            </span>
          )}
        </div>

        {mode === 'paste' ? (
          <div className="paste-pane">
            <textarea
              className="paste-textarea"
              placeholder="Paste or type your update in plain English. Mention the project, what changed, what's next, and any blockers."
              value={raw}
              onChange={(e) => setRaw(e.target.value)}
              rows={8}
            />
            <div className="paste-examples">
              <span className="label">Try:</span>
              {examples.map((ex, i) => (
                <button key={i} type="button" className="example-btn" onClick={() => setRaw(ex)}>
                  Example {i + 1}
                </button>
              ))}
            </div>
            {parseError && <div className="parse-error">{parseError}</div>}
            {parsed && parsed.notes && (
              <div className="parse-notes">
                <strong>Notes:</strong> {parsed.notes}
              </div>
            )}
            <div className="form-actions">
              <button type="button" className="btn" onClick={onClose}>Cancel</button>
              <button type="button" className="btn primary" onClick={parseWithAI} disabled={parsing || !raw.trim()}>
                {parsing ? <><Icon.Spinner /> Parsing…</> : <><Icon.Sparkle /> Parse with AI</>}
              </button>
            </div>
          </div>
        ) : (
          <div className="manual-pane">
            {parsed && (
              <div className="parse-summary">
                <Icon.Sparkle style={{color: confidenceColor(parsed.confidence)}} />
                <span>AI populated these fields from your update. Review and edit anything before submitting.</span>
                <button type="button" className="btn sm ghost" onClick={() => setMode('paste')}>Re-parse</button>
              </div>
            )}
            <div className="form-grid">
              <div className="form-field full">
                <label>Project {parsed && parsed.fields.matchedProjectId && <span className="field-tag ok">Matched existing</span>}{lockedProject && <span className="field-tag ok"><Icon.Lock style={{width:10,height:10,marginRight:3}}/>Locked</span>}</label>
                {lockedProject ? (
                  <div style={{padding:'10px 12px', border:'1px solid var(--line-3)', borderRadius:8, background:'#F5F5F5', color:'var(--ink)', fontSize:14, display:'flex', alignItems:'center', gap:8}}>
                    <Icon.Lock style={{width:13,height:13,color:'var(--muted)'}} />
                    <span>{lockedProject.name}</span>
                    <span style={{color:'var(--muted-2)',margin:'0 4px'}}>·</span>
                    <span className="mono" style={{color:'var(--muted)', fontSize:12.5}}>{lockedProject.team}</span>
                  </div>
                ) : parsed && parsed.fields.matchedProjectId ? (
                  <select value={form.matchedProjectId} onChange={(e) => {
                    const matched = projects.find(p => p.id === e.target.value);
                    setForm({...form, matchedProjectId: e.target.value, name: matched?.name || form.name, owner: matched?.owner || form.owner, team: matched?.team || form.team});
                  }}>
                    <option value="">— New project —</option>
                    {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                ) : (
                  <input value={form.name} onChange={update('name')} placeholder="e.g. Partner API GA" required />
                )}
              </div>
              <div className="form-field">
                <label>Owner</label>
                <input value={form.owner} onChange={update('owner')} placeholder="Full name" required />
              </div>
              <div className="form-field">
                <label>Team</label>
                <input value={form.team} onChange={update('team')} placeholder="e.g. Platform" />
              </div>
              <div className="form-field full">
                <label>Status</label>
                <div className="status-picker">
                  {['green','yellow','red'].map(s => (
                    <label key={s} className={form.status === s ? `sel-${s}` : ''}>
                      <input type="radio" name="status" value={s} checked={form.status === s} onChange={update('status')} />
                      <span className="swatch" style={{ background: `var(--${s === 'green' ? 'green' : s === 'yellow' ? 'amber' : 'red'})` }} />
                      <span>{statusLabel(s)}</span>
                    </label>
                  ))}
                </div>
              </div>
              <div className="form-field full">
                <label>Current status · one bullet per line</label>
                <textarea value={form.current} onChange={update('current')} placeholder={'Core API integration shipped\nBeta with 5 customers'} />
              </div>
              <div className="form-field full">
                <label>Next steps · one bullet per line</label>
                <textarea value={form.next} onChange={update('next')} />
              </div>
              <div className="form-field full">
                <label>Risks / blockers · one bullet per line</label>
                <textarea value={form.risks} onChange={update('risks')} placeholder="Waiting on vendor API approval" />
              </div>
            </div>
            <div className="form-actions">
              <button type="button" className="btn" onClick={onClose}>Cancel</button>
              <button type="submit" className="btn primary">Submit update</button>
            </div>
          </div>
        )}
      </form>
    </div>
  );
}

function Tweaks({ state, setState }) {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);
  if (!visible) return null;
  const toggle = (k) => () => {
    const next = { ...state, [k]: !state[k] };
    setState(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: next[k] } }, '*');
  };
  return (
    <div className="tweaks">
      <h5>Tweaks</h5>
      <div className="tweak-row">
        <span>Executive Summary</span>
        <button className={`toggle ${state.showSummary ? 'on' : ''}`} onClick={toggle('showSummary')} />
      </div>
      <div className="tweak-row">
        <span>Compact density</span>
        <button className={`toggle ${state.compact ? 'on' : ''}`} onClick={toggle('compact')} />
      </div>
    </div>
  );
}

function Toast({ msg }) {
  if (!msg) return null;
  return <div className="toast">{msg}</div>;
}

Object.assign(window, { Icon, StatusPill, ChangeBadge, ProjectCard, ExecutiveSummary, UpdateForm, Tweaks, Toast, HealthDonut, statusLabel });

</script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showSummary": true,
  "compact": false,
  "defaultView": "list"
}/*EDITMODE-END*/;

// Pick the single most important line for the focus cell
function ChannelChip({ channel, unread, onClick }) {
  if (!channel) return null;
  return (
    <button className="chan-btn" onClick={(e) => { e.stopPropagation(); onClick && onClick(); }} title={'Teams: #' + channel + (unread ? ' — ' + unread + ' unread' : '')}>
      <Icon.Teams />
      <span>#{channel}</span>
      {unread > 0 && <span className="unread-dot" />}
    </button>
  );
}

function ConnectedSection({ p }) {
  const connectorIcon = { linear: <Icon.Linear />, github: <Icon.Github />, doc: <Icon.Doc /> };
  const connectorLabel = { linear: 'Linear', github: 'GitHub', doc: 'Doc' };
  return (
    <div className="exp-connected">
      <span className="label">Connected</span>
      {p.channel && (
        <a className="conn-chip primary" onClick={(e) => e.preventDefault()} href="#">
          <Icon.Teams />
          <span className="mono">#{p.channel}</span>
          {p.unread > 0 && <span className="count">{p.unread}</span>}
          <span className="activity">· {p.lastActivity}</span>
        </a>
      )}
      {(p.connectors || []).map((c, i) => (
        <a key={i} className="conn-chip" onClick={(e) => e.preventDefault()} href="#">
          {connectorIcon[c.type]}
          <span>{connectorLabel[c.type]}</span>
          <span className="mono" style={{color:'var(--muted)'}}>{c.label}</span>
          {c.count != null && <span className="count">{c.count}</span>}
        </a>
      ))}
      <span className="connect-hint">
        <kbd>+</kbd> Add connector
      </span>
    </div>
  );
}

function pickFocus(p) {
  let tone = 'next', label = 'Next';
  if (p.status === 'red') { tone = 'risk'; label = 'Blocker'; }
  else if (p.status === 'yellow') { tone = 'atrisk'; label = 'Risk'; }
  else if (p.status === 'green') { tone = 'win'; label = 'Win'; }
  if (p.focus) return { tone, label, text: p.focus };
  if (p.status === 'red' && p.risks && p.risks[0]) return { tone, label, text: p.risks[0] };
  if (p.status === 'yellow' && p.risks && p.risks[0]) return { tone, label, text: p.risks[0] };
  if (p.status === 'green' && p.current && p.current[0]) return { tone, label, text: p.current[0] };
  if (p.next && p.next[0]) return { tone, label, text: p.next[0] };
  return null;
}

function highlight(text, q) {
  if (!q) return text;
  try {
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    const parts = text.split(re);
    return parts.map((part, i) => re.test(part) ? <em key={i}>{part}</em> : <React.Fragment key={i}>{part}</React.Fragment>);
  } catch { return text; }
}

function projectMatches(p, q) {
  if (!q) return true;
  const hay = [p.name, p.owner, p.team, ...(p.current||[]), ...(p.next||[]), ...(p.risks||[])].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function SearchBar({ value, onChange, onClear }) {
  const ref = React.useRef(null);
  useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); ref.current?.focus(); }
      if (e.key === 'Escape' && document.activeElement === ref.current) { onClear(); ref.current?.blur(); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClear]);
  return (
    <div className="search-wrap">
      <Icon.Search />
      <input ref={ref} value={value} onChange={(e) => onChange(e.target.value)} placeholder="Search projects, owners, risks…" />
      {value ? (
        <button className="search-clear" onClick={onClear} aria-label="Clear"><Icon.X style={{width:13,height:13}}/></button>
      ) : (
        <kbd>⌘K</kbd>
      )}
    </div>
  );
}

function ExpansionRow({ p, colSpan, onShare }) {
  return (
    <tr className="expansion">
      <td colSpan={colSpan}>
        <div className="exp-inner">
          <div className="exp-col">
            <h4>Current · {p.current.length}</h4>
            <Bullets items={p.current} />
          </div>
          <div className="exp-col">
            <h4>Next steps · {p.next.length}</h4>
            <Bullets items={p.next} variant="next" />
          </div>
          {p.risks && p.risks.length > 0 && (
            <div className="exp-risks" style={{ gridColumn: '1 / -1' }}>
              <strong>Risks &amp; Blockers</strong>
              <ul>{p.risks.map((r, i) => <li key={i}>{r}</li>)}</ul>
            </div>
          )}
          <ConnectedSection p={p} />
          {p.metrics && p.metrics.length > 0 && (
            <div className="exp-metrics">
              {p.metrics.map((m, i) => <Metric key={i} m={m} />)}
            </div>
          )}
          {onShare && (
            <div className="exp-actions" style={{ gridColumn: '1 / -1' }}>
              <button className="btn sm" onClick={(e) => { e.stopPropagation(); onShare(p); }}>
                <Icon.Link className="btn-icon" />
                Share submission link for {p.name}
              </button>
              <span className="exp-actions-hint">
                Sends a pre-filled, project-locked form link this project's contributors can fill out.
              </span>
            </div>
          )}
        </div>
      </td>
    </tr>
  );
}

function Row({ p, q, expanded, onToggle, onStar, starred, onShare }) {
  const focus = pickFocus(p);
  return (
    <>
      <tr className={'row ' + (expanded ? 'expanded' : '')} onClick={onToggle}>
        <td className="col-name">
          <div className="td-name-inner">
            <Icon.ChevRight className={'caret ' + (expanded ? 'open' : '')} />
            <button className={'star-btn ' + (starred ? 'on' : '')} onClick={(e) => { e.stopPropagation(); onStar(); }} aria-label="Pin">
              <Icon.Star filled={starred} />
            </button>
            <span style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',minWidth:0,flex:'1 1 auto'}}>{highlight(p.name, q)}</span>
            {p.prevStatus && p.prevStatus !== p.status && <ChangeBadge prev={p.prevStatus} current={p.status} />}
          </div>
        </td>
        <td className="col-status"><StatusPill status={p.status} /></td>
        <td className="col-owner">{highlight(p.owner, q)}</td>
        <td className="col-team">{p.team}</td>
        <td className="col-updated">{p.updated}</td>
        <td className="col-focus">
          {focus ? (
            <div className="focus-cell">
              <span className={'label ' + focus.tone}>{focus.label}</span>
              <span className="text">{highlight(focus.text, q)}</span>
            </div>
          ) : <span style={{color:'var(--muted-2)'}}>—</span>}
        </td>
      </tr>
      {expanded && <ExpansionRow p={p} colSpan={6} onShare={onShare} />}
    </>
  );
}

function ListView({ projects, q, starred, onStar, onShare }) {
  const [expandedId, setExpandedId] = useState(null);
  const toggle = (id) => setExpandedId(expandedId === id ? null : id);

  const pinned = projects.filter(p => starred.has(p.id));
  const rest = projects.filter(p => !starred.has(p.id));

  const renderTable = (rows) => (
    <div className="table-wrap">
      <table className="table">
        <thead>
          <tr>
            <th>Project</th>
            <th>Status</th>
            <th>Owner</th>
            <th>Team</th>
            <th>Updated</th>
            <th>Focus</th>
          </tr>
        </thead>
        <tbody>
          {rows.map(p => (
            <Row key={p.id} p={p} q={q}
              expanded={expandedId === p.id}
              onToggle={() => toggle(p.id)}
              starred={starred.has(p.id)}
              onStar={() => onStar(p.id)}
              onShare={onShare} />
          ))}
        </tbody>
      </table>
    </div>
  );

  if (projects.length === 0) {
    return <div className="search-empty"><span className="mono">No matches</span>Try a different search term or clear filters.</div>;
  }

  return (
    <>
      {pinned.length > 0 && (
        <>
          <div className="list-section">
            <h3>Pinned</h3>
            <span className="mono">{pinned.length}</span>
            <div className="rule"></div>
          </div>
          {renderTable(pinned)}
        </>
      )}
      {rest.length > 0 && (
        <>
          {pinned.length > 0 && (
            <div className="list-section">
              <h3>All projects</h3>
              <span className="mono">{rest.length}</span>
              <div className="rule"></div>
            </div>
          )}
          {renderTable(rest)}
        </>
      )}
    </>
  );
}

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [view, setView] = useState(TWEAK_DEFAULTS.defaultView || 'list');
  const [showAll, setShowAll] = useState(false);
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState('default');
  const [formOpen, setFormOpen] = useState(false);
  const [lockedProjectId, setLockedProjectId] = useState(null);
  const [extras, setExtras] = useState([]);
  const [week, setWeek] = useState(window.WEEK_LABEL);
  const [weekIdx, setWeekIdx] = useState(0);
  const [toast, setToast] = useState('');
  const [query, setQuery] = useState('');
  const [starred, setStarred] = useState(new Set(['platform-migration', 'mobile-launch']));

  // Handle URL params: #project=<id>&submit=1 (hash-based so preview auth stays intact)
  useEffect(() => {
    const parseHash = () => {
      const hash = window.location.hash.replace(/^#/, '');
      if (!hash) return;
      const params = new URLSearchParams(hash);
      const pid = params.get('project');
      const submit = params.get('submit');
      if (pid && submit === '1') {
        const exists = window.PROJECTS.find(p => p.id === pid);
        if (exists) {
          setLockedProjectId(pid);
          setFormOpen(true);
        }
      }
    };
    parseHash();
    window.addEventListener('hashchange', parseHash);
    return () => window.removeEventListener('hashchange', parseHash);
  }, []);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(''), 2600);
    return () => clearTimeout(t);
  }, [toast]);

  const allProjects = useMemo(() => [...extras, ...window.PROJECTS], [extras]);

  const filtered = useMemo(() => {
    let list = allProjects.filter(p => projectMatches(p, query));
    if (filter === 'attention') list = list.filter(p => p.status !== 'green');
    if (filter === 'risk') list = list.filter(p => p.status === 'red' || p.status === 'yellow');
    if (filter === 'red') list = list.filter(p => p.status === 'red');

    if (sort === 'recent') list = [...list].sort((a, b) => b.updated.localeCompare(a.updated));
    else if (sort === 'risk') {
      const rank = { red: 0, yellow: 1, green: 2 };
      list = [...list].sort((a, b) => rank[a.status] - rank[b.status]);
    } else if (sort === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    return list;
  }, [allProjects, filter, sort, query]);

  // Grid view uses featured subset
  const featured = filtered.filter(p => p.featured || extras.find(e => e.id === p.id)).slice(0, 4);
  const additional = showAll ? filtered.filter(p => !featured.includes(p)) : [];

  const toggleStar = (id) => {
    const next = new Set(starred);
    if (next.has(id)) next.delete(id); else next.add(id);
    setStarred(next);
  };

  const handleSubmit = (project) => {
    setExtras([project, ...extras]);
    setFormOpen(false);
    setLockedProjectId(null);
    setToast(`"${project.name}" added to this week's update`);
  };

  const handleShare = (project) => {
    const base = window.location.origin + window.location.pathname + window.location.search;
    const url = `${base}#project=${encodeURIComponent(project.id)}&submit=1`;
    // Attempt to write to clipboard
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        () => setToast(`Share link for "${project.name}" copied to clipboard`),
        () => setToast(`Link: ${url}`)
      );
    } else {
      setToast(`Link: ${url}`);
    }
  };

  const handleCloseForm = () => {
    setFormOpen(false);
    setLockedProjectId(null);
    // Clear hash if we got here from a share link
    if (lockedProjectId && window.location.hash) {
      window.history.replaceState({}, '', window.location.pathname + window.location.search);
    }
  };

  const exportSnapshot = () => window.print();

  const statusCounts = {
    green: allProjects.filter(p => p.status === 'green').length,
    yellow: allProjects.filter(p => p.status === 'yellow').length,
    red: allProjects.filter(p => p.status === 'red').length,
  };

  return (
    <div className="app">
      <header className="topbar">
        <div className="topbar-inner">
          <div className="brand">
            <span className="brand-mark"></span>
            <span className="brand-name">Northline</span>
            <span className="brand-sep">/</span>
            <span className="brand-sub">Executive Review</span>
          </div>
          <div className="top-spacer"></div>
          <a href="Automation Roadmap.html" className="brand-sub" style={{color:'var(--muted)', textDecoration:'none', fontSize:13.5, marginRight:16, display:'inline-flex', alignItems:'center', gap:6}} title="View automation roadmap">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" width="13" height="13"><path d="M2 8h12M10 4l4 4-4 4" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Roadmap
          </a>
          <div className="top-meta">
            <span>Portfolio</span>
            <span className="top-dot"></span>
            <span className="mono">{allProjects.length} projects</span>
            <span className="top-dot"></span>
            <span className="mono" style={{color:'var(--red-ink)'}}>{statusCounts.red} off track</span>
          </div>
        </div>
      </header>

      <main className="page">
        <div className="page-head">
          <div>
            <div className="eyebrow">WEEKLY DIGEST — NO. 16</div>
            <h1 className="title">Weekly Executive Project <span className="accent">Update</span></h1>
            <div className="subtitle">{week} · A thirty-second read on what is working, what is not, and what is next.</div>
          </div>
          <div className="head-actions">
            <button className="btn" onClick={() => setWeekIdx(weekIdx === 0 ? 1 : 0)}>
              <Icon.History className="btn-icon" />
              {weekIdx === 0 ? 'Past weeks' : 'Current week'}
            </button>
            <button className="btn" onClick={exportSnapshot}>
              <Icon.Export className="btn-icon" />
              Export
            </button>
            <button className="btn primary" onClick={() => setFormOpen(true)}>
              <Icon.Plus className="btn-icon" />
              Submit update
            </button>
          </div>
        </div>

        {weekIdx > 0 && (
          <div className="history-banner">
            <Icon.History className="btn-icon" />
            <span>Viewing archived snapshot:</span>
            <span className="mono">{window.PRIOR_WEEKS[weekIdx - 1].label} · {window.PRIOR_WEEKS[weekIdx - 1].summary}</span>
            <button className="btn sm" onClick={() => setWeekIdx(0)}>Close</button>
          </div>
        )}

        {tweaks.showSummary && <ExecutiveSummary data={window.EXEC_SUMMARY} projects={allProjects} />}

        <div className="toolbar-row">
          <SearchBar value={query} onChange={setQuery} onClear={() => setQuery('')} />
          <div className="view-switch">
            <button className={view === 'list' ? 'on' : ''} onClick={() => setView('list')}>
              <Icon.List /> List
            </button>
            <button className={view === 'grid' ? 'on' : ''} onClick={() => setView('grid')}>
              <Icon.GridIcon /> Grid
            </button>
          </div>
        </div>

        <div className="toolbar-row filters">
          <div className="toolbar-left">
            <div className="segmented">
              <button className={filter === 'all' ? 'on' : ''} onClick={() => setFilter('all')}>All <span style={{opacity:0.6,marginLeft:4}}>{allProjects.length}</span></button>
              <button className={filter === 'attention' ? 'on' : ''} onClick={() => setFilter('attention')}>Needs attention <span style={{opacity:0.6,marginLeft:4}}>{statusCounts.yellow + statusCounts.red}</span></button>
              <button className={filter === 'risk' ? 'on' : ''} onClick={() => setFilter('risk')}>At risk <span style={{opacity:0.6,marginLeft:4}}>{statusCounts.yellow}</span></button>
              <button className={filter === 'red' ? 'on' : ''} onClick={() => setFilter('red')}>Off track <span style={{opacity:0.6,marginLeft:4}}>{statusCounts.red}</span></button>
            </div>
            <div className="select">
              <span className="toolbar-label">Sort</span>
              <select value={sort} onChange={(e) => setSort(e.target.value)}>
                <option value="default">Featured</option>
                <option value="risk">Highest risk</option>
                <option value="recent">Most recent</option>
                <option value="name">Name</option>
              </select>
              <span className="select-caret">▾</span>
            </div>
          </div>
          <div className="toolbar-right">
            <span className="toolbar-label mono">
              {filtered.length} of {allProjects.length}
              {query && <span style={{marginLeft:6,color:'var(--ink-2)'}}>· "{query}"</span>}
            </span>
          </div>
        </div>

        {view === 'list' ? (<div className="list-view-bound">
          <ListView projects={filtered} q={query} starred={starred} onStar={toggleStar} onShare={handleShare} /></div>
        ) : (
          <>
            <div className="grid">
              {featured.length === 0 ? (
                <div className="empty" style={{ gridColumn: '1 / -1' }}>No projects match this filter.</div>
              ) : (
                featured.map(p => <ProjectCard key={p.id} p={p} compact={tweaks.compact} onShare={handleShare} />)
              )}
            </div>
            <div className="view-all-wrap">
              <button className="btn" onClick={() => setShowAll(!showAll)}>
                {showAll ? 'Hide additional projects' : `Show all projects · ${filtered.length - featured.length} more`}
                <Icon.Chev style={{ transform: showAll ? 'rotate(180deg)' : 'none', transition: 'transform .2s' }} />
              </button>
            </div>
            {showAll && additional.length > 0 && (
              <div className="more-wrap">
                <div className="more-head">
                  <h2>Additional projects</h2>
                  <span className="mono">{additional.length} tracked</span>
                  <div className="rule"></div>
                </div>
                <div className="grid compact">
                  {additional.map(p => <ProjectCard key={p.id} p={p} compact={true} onShare={handleShare} />)}
                </div>
              </div>
            )}
          </>
        )}
      </main>

      {formOpen && <UpdateForm onClose={handleCloseForm} onSubmit={handleSubmit} projects={allProjects} lockedProjectId={lockedProjectId} />}
      <Tweaks state={tweaks} setState={setTweaks} view={view} setView={setView} />
      <Toast msg={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
